:root{--ink:#17163A;--paper:#F4F2FF;--violet:#5B3DF5;--l1:#B6F04B;--l2:#4FD8E8;--l3:#FFC93C;--l4:#FF6FB1;--good:#0E9F57;--goodbg:#D5F5E3;--bad:#D92D20;--badbg:#FFE1DE;--mute:#5F5D86;--line:#DAD6F7;--sans:"WG Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"WG Serif",Georgia,"Times New Roman",serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font:500 16px/1.45 var(--sans);color:var(--ink);background:var(--paper) radial-gradient(circle,#D6D1F6 1px,transparent 1.3px) 0 0/22px 22px;min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid #FFB000;outline-offset:2px}
.l1{--c:var(--l1)}.l2{--c:var(--l2)}.l3{--c:var(--l3)}.l4{--c:var(--l4)}
#main{max-width:720px;margin:0 auto;padding:16px 16px 140px}
h1,h2,h3{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;line-height:1.15}
h2{font-size:24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-size:24px;letter-spacing:-.04em;white-space:nowrap}
.logo b{display:inline-block;background:var(--violet);color:#fff;padding:1px 9px 3px;border-radius:12px;border:3px solid var(--ink);margin-left:6px;transform:rotate(-3deg)}
.chips{display:flex;gap:8px;align-items:center}
.chip{border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:700;background:#fff;white-space:nowrap}
.ib{width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;background:#fff;font-size:20px;line-height:1;display:grid;place-items:center}
.btn{display:inline-block;font-weight:700;font-size:17px;padding:13px 22px;border:3px solid var(--ink);border-radius:16px;background:var(--violet);color:#fff;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.btn.big{font-size:20px;padding:16px 28px;width:100%}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:default}
.link{background:none;border:0;text-decoration:underline;color:var(--mute);padding:10px;font-size:15px}
.hero{background:var(--violet);color:#fff;border:3px solid var(--ink);border-radius:30px;padding:22px 22px 26px;box-shadow:8px 8px 0 var(--ink);margin:20px 0 22px}
.hero h2{font-size:30px;margin-bottom:6px}
.hero p{margin-bottom:16px;font-size:18px}
.hero .btn{background:#fff;color:var(--ink)}
.goal{height:14px;background:rgba(255,255,255,.28);border-radius:99px;margin:0 0 16px;overflow:hidden;border:2px solid var(--ink)}
.goal i{display:block;height:100%;background:var(--l1);transition:width .4s}
.panel{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:18px;margin:0 0 18px}
.panel h3{font-size:19px;margin-bottom:10px}
.panel p.sub{color:var(--mute);font-size:14px;margin:-4px 0 12px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:6px 14px;font-weight:700;font-size:15px}
.pill[aria-pressed=true]{background:var(--c,var(--ink));color:var(--ink)}
.pill[aria-pressed=true]:not([class*=" l"]){background:var(--ink);color:#fff}
.pill small{font-weight:500;opacity:.8;margin-left:4px}

const reOf = e => new RegExp('(^|[^A-Za-z0-9])(' + e.forms.map(reEsc).join('|') + ')(?![A-Za-z0-9])', 'gi');

}
const hl = e => markUp(e.ex, e, t => '<mark>' + esc(t) + '</mark>');
const gapHTML = e => markUp(e.ex, e, () => '<span class="gap"></span>');

/* ================= workout (session) ================= */
function startSession(o = {}) {
  closeModal();
  const one = o.one; let rev = [], neu = [];
  if (one) { /* single word */ }
  else if (o.review) rev = dueList().slice(0, S.set.size + 5);
  else {
    const p = plan(); rev = p.rev; neu = p.neu;
    if (!rev.length && !neu.length) rev = shuffle(W.filter(e => S.w[e.key])).slice(0, S.set.size);
    if (!rev.length && !neu.length) neu = ORDER.slice(0, 5);
  }
  const full = one ? [one] : neu, q = [];
  rev.forEach(e => q.push({ e, k: 'q', qt: reviewType(e, S.w[e.key][0]) }));
  full.forEach(e => { q.push({ e, k: 'learn' }, { e, k: 'q', qt: 'mean' }, { e, k: 'q', qt: canCloze(e) ? 'cloze' : 'word' }); });
  full.forEach(e => q.push({ e, k: 'q', qt: thirdType(e) }));
  full.forEach(e => q.push({ e, k: 'say' }));
  SES = { q, total: q.length, done: 0, st: {}, combo: 0, xp: 0, n: 0, ok: 0, cur: null, nw: full.length, rv: rev.length, busy: false, tries: 0, fin: false };

}

}
const mcHTML = (q, wide) => `<div class="opts${wide ? ' w' : ''}">${q.opts.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${esc(wide ? o.x : cap(o.x))}</button>`).join('')}</div>`;
function qHTML(q, audio) {
  const e = q.e, sp = `<button class="spk" data-act="hear" aria-label="Hear the word">${ICON}</button>`, sl = '<button class="spk" data-act="slow" aria-label="Hear it slowly">🐢</button>';
  const clue = `<p class="quote">${esc(cap(e.def))}.</p>`;
  if (q.t === 'mean') return `<div class="qword">${esc(e.show)}${e.sense ? ` <small>(${esc(e.sense)})</small>` : ''}${audio ? sp : ''}</div><p class="qlabel">What does it mean?</p>${mcHTML(q, 0)}`;
  if (q.t === 'word') return `${clue}<p class="qlabel">Which word fits this meaning?</p>${mcHTML(q, 1)}`;
  if (q.t === 'cloze') return `<p class="quote" id="cl">${gapHTML(e)}</p><p class="qlabel">Choose the word that fits.</p>${mcHTML(q, 1)}${audio ? '<div class="row c" id="hintrow"><button class="link" data-act="hint">Show a hint</button></div>' : ''}`;
  if (q.t === 'listen') return `<p class="qlabel">Listen. Which word do you hear?</p><div class="spks inl">${sp}${sl}</div>${mcHTML(q, 1)}`;
  const inp = ph => `<input id="ans" class="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ph}" aria-label="Type the word"><div class="row c"><button class="btn" data-act="check">Check</button><button class="link" data-act="hint">Show first letter</button></div>`;
  const ph = e.w.replace(/[A-Za-z]/g, '_').split('').join(' ');
  if (q.t === 'spell') return `<p class="qlabel">Listen and type the word.</p><div class="spks inl">${sp}${sl}</div>${clue}${inp(ph)}`;
  if (q.t === 'clozeType') return `<p class="quote" id="cl">${gapHTML(e)}</p><p class="qlabel">Type the missing word.</p>${inp(ph)}`;
  if (q.t === 'scramble') return `<p class="qlabel">Put the letters in order.</p><div class="spks inl">${sp}${sl}</div>${clue}<div class="ans" id="sans"></div><div class="pool" id="spool"></div><div class="row c"><button class="link" data-act="again">Start again</button></div>`;
  return '';
}
function renderQ(t) {
  view = 'q'; const e = t.e, q = SES.qo = build(e, t.qt);
  setMain(`${sesBar()}<div class="q l${e.lvl}">${qHTML(q, 1)}</div>`);
  if (q.t === 'scramble') drawScr();
  if (S.set.auto && /listen|spell|scramble/.test(q.t)) say(spoken(e));
  const i = $('#ans'); if (i) i.focus();
  if (i) i.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); ev.stopPropagation(); ACT.check(); } });
}
function drawScr() {
  const q = SES.qo, n = q.letters.length;
  $('#sans').innerHTML = Array.from({ length: n }, (_, k) => q.pick[k] !== undefined ? `<button class="slot f${q.res || ''}" data-act="slot" data-k="${k}" aria-label="Remove letter">${esc(q.letters[q.pick[k]])}</button>` : '<span class="slot"></span>').join('');
  $('#spool').innerHTML = q.letters.map((c, i) => `<button class="tile" data-act="tile" data-i="${i}" ${q.pick.includes(i) ? 'disabled' : ''}>${esc(c)}</button>`).join('');
}
function fb(kind, e, title, extra) {
  foot.innerHTML = `<div class="fb ${kind}"><div class="fbin"><div class="fbt"><strong>${title}</strong><span>${extra || (esc(e.show) + ': ' + esc(e.def))}</span></div><button class="btn go" data-act="next">Continue</button></div></div>`;
  foot.classList.add('on'); $('.go', foot).focus({ preventScroll: true });
}
function answer(ok, wrongNote) {
  const t = SES.cur, e = t.e, st = SES.st[e.key] || (SES.st[e.key] = { n: !rec(e), m: 0, f: null, r: 0 });
  if (st.f === null && !t.retry) st.f = ok ? 1 : 0;
  S.tot++; SES.n++; if (ok) { S.ok++; SES.ok++; }
  if (ok) { SES.combo++; addXP(t.retry ? 5 : 10 + Math.min(SES.combo, 6) * 2); }
  else { SES.combo = 0; st.m++; if (++st.r <= 2) { SES.q.splice(Math.min(2, SES.q.length), 0, { e, k: 'q', qt: altType(e, t.qt), retry: true }); SES.total++; } }
  if (ok) sfx.ok(); else sfx.bad();
  $('#hud').textContent = hud();
  fb(ok ? 'ok' : 'bad', e, ok ? pick(['Nice!', 'Great!', 'Correct!', 'Well done!', 'Yes!']) : (wrongNote || 'Not quite.'));
}
function answerMC(i) {
  const q = SES.qo; if (!q || q.done || !q.opts) return; q.done = 1;
  $$('.opt').forEach((b, k) => { b.disabled = true; b.classList.add(q.opts[k].ok ? 'ok' : k === i ? 'no' : 'dim'); });
  if (q.t === 'cloze') $('#cl').innerHTML = markUp(q.e.ex, q.e, t => '<mark>' + esc(t) + '</mark>');
  answer(!!q.opts[i].ok);
}
function renderSay(t) {
  view = 'say'; const e = t.e, mic = S.set.mic && SR;
  setMain(`${sesBar()}<div class="q l${e.lvl}"><p class="qlabel">Say it out loud</p><p class="bigsent">${hl(e)}</p><div class="spks inl"><button class="spk" data-act="exs" aria-label="Hear the sentence">${ICON}</button><button class="spk" data-act="exslow" aria-label="Hear the sentence slowly">🐢</button></div>
  <div class="saybox">${mic ? '<button class="btn" id="micb" data-act="mic">Tap and speak</button>' : '<button class="btn" data-act="said">I said it</button>'}<p class="heard" id="heard" aria-live="polite"></p><button class="link" data-act="skip">Skip</button></div></div>`);
}
const NUM = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90, hundred: 100, thousand: 1000 };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function spoke(tr, e) {
  const n = ' ' + tr.toLowerCase().replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  if (e.forms.some(f => n.includes(' ' + f.toLowerCase().replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim() + ' '))) return true;
  const v = NUM[e.w.toLowerCase()]; return v !== undefined && (n.includes(' ' + v + ' ') || n.includes(' ' + v.toLocaleString('en-US') + ' '));
}
function hear(cb) {
  try {
    const r = new SR(); let done = false, t;
    const fin = x => { if (done) return; done = true; clearTimeout(t); cb(x); };
    r.lang = 'en-US'; r.maxAlternatives = 5; r.interimResults = false;
    r.onresult = ev => fin({ alts: Array.from(ev.results[0]).map(a => a.transcript) });
    r.onerror = ev => fin({ err: ev.error });
    r.onend = () => fin({ err: 'no-speech' });
    r.start(); t = setTimeout(() => { try { r.abort(); } catch (e) { } }, 9000);
  } catch (e) { cb({ err: 'unsupported' }); }
}
function sayDone(ok) {
  addXP(ok ? 5 : 2); $('#hud').textContent = hud(); if (ok) sfx.ok();
  fb('neu', SES.cur.e, ok ? 'Great speaking!' : 'Good try. Keep practicing.', 'Say it again out loud a few times.');
}
function finalize() {
  const now = Date.now(); let nw = 0;
  for (const k in SES.st) {
    const st = SES.st[k]; if (st.f === null) continue;
    let r = S.w[k]; if (!r) { r = S.w[k] = [0, 0, 0, 0, now]; nw++; }
    r[0] = st.n ? (st.m ? 0 : 1) : (st.f ? Math.min(6, r[0] + 1) : Math.max(0, r[0] - 2));
    r[1] = now + (r[0] ? INT[r[0]] * DAY : MIN10); r[2]++; if (st.m) r[3]++; r[4] = now; S.today++;
  }
  if (nw) addXP(nw * 10);
  if (SES.n) touchStreak();
  save(); return nw;
}
function finish() {
  if (SES.fin) return; SES.fin = true; view = 'sum'; foot.classList.remove('on');
  addXP(20); const nw = finalize(); save();
  const weak = Object.keys(SES.st).filter(k => SES.st[k].m);
  const acc = SES.n ? Math.round(SES.ok / SES.n * 100) : 100;
  setMain(`<div class="sum"><h2>Workout complete</h2><section class="panel"><div class="stats"><div><b>${nw}</b><span>new words</span></div><div><b>${acc}%</b><span>answers right</span></div><div><b>+${SES.xp}</b><span>XP</span></div></div></section>
  <p class="st">🔥 ${curStreak()} day streak. ${Math.min(S.today, S.set.goal)} of ${S.set.goal} words done today.</p>
  ${weak.length ? `<h3>Practice these again</h3><div class="wchips">${weak.map(k => `<button class="wchip" data-act="hearw" data-k="${esc(k)}">${esc(BYKEY.get(k).show)}</button>`).join('')}</div>` : ''}
  <div class="row"><button class="btn" data-act="start">Another workout</button><button class="btn alt" data-act="home">Home</button></div></div>`);
  sfx.win(); if (acc >= 60) confetti();
}
function quit() { if (SES && !SES.fin) { SES.fin = true; if (SES.n) { finalize(); } } home(); }

/* ================= 60-second sprint ================= */
function sprint() {
  view = 'sprint'; closeModal();
  const learned = W.filter(e => S.w[e.key]);
  const pool = learned.length >= 12 ? learned : W.filter(e => e.lvl === (S.set.focus || 1));
  SP = { pool, t0: Date.now(), dur: 60000, pen: 0, score: 0, combo: 0, n: 0, ok: 0, lock: false, last: null, q: null };
  setMain(`<div class="sbar"><button class="ib x" data-act="home" aria-label="Quit">✕</button><div class="timer" style="flex:1;margin:0"><i id="tm"></i></div><div class="hud" id="sc">0</div></div><div id="spq"></div>`);
  spNext(); SP.iv = setInterval(() => { const left = SP.dur - (Date.now() - SP.t0) - SP.pen; if (left <= 0) spEnd(); else $('#tm') && ($('#tm').style.width = left / SP.dur * 100 + '%'); }, 100);
}
function spNext() {
  let e; do { e = pick(SP.pool); } while (e === SP.last && SP.pool.length > 1);
  SP.last = e; SP.lock = false;
  const t = pick(['mean', 'word', canCloze(e) ? 'cloze' : 'mean']);
  SP.q = build(e, t);
  $('#spq').innerHTML = `<div class="q l${e.lvl}" style="margin-top:20px">${qHTML(SP.q, 0)}</div>`;
}
function spAnswer(i) {
  if (!SP || SP.lock || SP.end) return; SP.lock = true;
  const q = SP.q, ok = !!q.opts[i].ok;
  $$('.opt').forEach((b, k) => { b.disabled = true; b.classList.add(q.opts[k].ok ? 'ok' : k === i ? 'no' : 'dim'); });
  SP.n++;
  if (ok) { SP.ok++; SP.combo++; SP.score += 10 + Math.min(SP.combo, 10); sfx.ok(); } else { SP.combo = 0; SP.pen += 3000; sfx.bad(); }
  $('#sc').textContent = SP.score + (SP.combo > 1 ? '  🔥 x' + SP.combo : '');
  setTimeout(() => { if (!SP.end) spNext(); }, ok ? 450 : 1100);
}
function spEnd() {
  if (SP.end) return; SP.end = true; clearInterval(SP.iv); view = 'sum';
  const best = S.best < SP.score; if (best) S.best = SP.score;
  S.xp += Math.floor(SP.score / 5); touchStreak(); save();
  setMain(`<div class="sum"><h2>Time's up</h2><section class="panel"><div class="stats"><div><b>${SP.score}</b><span>points</span></div><div><b>${SP.ok}/${SP.n}</b><span>right</span></div><div><b>${S.best}</b><span>best score</span></div></div></section>
  <p class="st">${best && SP.score ? 'New best score!' : 'You earned ' + Math.floor(SP.score / 5) + ' XP.'}</p><div class="row"><button class="btn" data-act="sprint">Play again</button><button class="btn alt" data-act="home">Home</button></div></div>`);
  sfx.win(); if (best && SP.score) confetti();
}

/* ================= events ================= */
const ACT = {
  home() { if (SP && SP.iv) clearInterval(SP.iv); SP = null; closeModal(); home(); },
  start() { startSession(); },
  review() { startSession({ review: 1 }); },
  sprint() { sprint(); },
  find() { find(''); },
  more() { find($('#q').value, find.n + 60); },
  settings() { settingsSheet(); },
  close() { closeModal(); if (view === 'home') home(); },
  focus(a) { S.set.focus = +a.dataset.f; save(); home(); },
  quit() { if (!SES || SES.fin || confirm('Leave this workout? Your progress so far is saved.')) quit(); },
  go() { if (SES.busy) return; SES.busy = true; const l = $('.learn'); if (l) l.classList.add('out'); setTimeout(() => { SES.done++; nextTask(); }, 260); },
  hear() { say(spoken(SES.cur.e)); },
  slow() { say(SES.cur.e.w, 1); },
  exs() { say(SES.cur.e.ex); },
  exslow() { say(SES.cur.e.ex, 1); },
  hearw(a) { say(spoken(BYKEY.get(a.dataset.k))); },
  exw(a) { say(BYKEY.get(a.dataset.k).ex); },
  openw(a) { wordSheet(BYKEY.get(a.dataset.k)); },
  study(a) { startSession({ one: BYKEY.get(a.dataset.k) }); },
  opt(a) { const i = +a.dataset.i; if (view === 'sprint') spAnswer(i); else answerMC(i); },
  hint() {
    const q = SES.qo, e = q.e;
    if (q.t === 'cloze') { const r = $('#hintrow'); if (r) r.innerHTML = `<span class="st">${esc(cap(e.def))}.</span>`; }
    else { const i = $('#ans'); if (i && !i.disabled) { i.value = e.w.charAt(0); i.focus(); q.hinted = 1; } }
  },
  check() {
    const q = SES.qo, i = $('#ans'); if (!i || i.disabled || q.done) return;
    const v = plain(i.value); if (!v) return; q.done = 1; i.disabled = true;
    const ok = q.e.forms.some(f => plain(f) === v); i.classList.add(ok ? 'ok' : 'no');
    if (q.t === 'clozeType') $('#cl').innerHTML = markUp(q.e.ex, q.e, t => '<mark>' + esc(t) + '</mark>');
    answer(ok, 'The correct spelling is ' + esc(q.e.show) + '.');
  },
  tile(a) { const q = SES.qo; if (q.done) return; q.pick.push(+a.dataset.i); drawScr(); if (q.pick.length === q.letters.length) { q.done = 1; const w = q.pick.map(i => q.letters[i]).join(''), ok = plain(w) === plain(q.e.w); q.res = ok ? ' ok' : ' no'; drawScr(); $$('.tile').forEach(b => b.disabled = true); answer(ok, 'The correct spelling is ' + esc(q.e.show) + '.'); } },
  slot(a) { const q = SES.qo; if (q.done) return; q.pick.splice(+a.dataset.k, 1); drawScr(); },
  again() { const q = SES.qo; if (q.done) return; q.pick = []; drawScr(); },
  mic(a) {
    if (SES.listening) return; SES.listening = 1; a.textContent = 'Listening...'; SES.tries++;
    const hd = $('#heard');
    hear(r => {
      SES.listening = 0; a.textContent = 'Tap and speak';
      if (r.err) {
        hd.textContent = (r.err === 'no-speech' || r.err === 'aborted') ? "I didn't hear anything. Try again." : (r.err === 'not-allowed' || r.err === 'service-not-allowed') ? 'The microphone is blocked. Allow it in your browser, or turn it off in Settings.' : 'The speech check is not available right now.';
        if (r.err !== 'no-speech' && r.err !== 'aborted') { a.outerHTML = '<button class="btn" data-act="said">I said it</button>'; }
        return;
      }
      const ok = r.alts.some(x => spoke(x, SES.cur.e));
      hd.innerHTML = 'I heard: <b>' + esc(r.alts[0]) + '</b>';
      if (ok) sayDone(true); else if (SES.tries >= 2) sayDone(false); else hd.innerHTML += '<br>Almost! Listen again, then try once more.';
    });
  },
  said() { sayDone(true); },
  skip() { SES.done++; nextTask(); },
  next() { SES.done++; nextTask(); },
  test() { say('Hello! This is how I say the words.'); },
  copy() {
    const c = btoa(unescape(encodeURIComponent(JSON.stringify(S)))), t = $('#s-code'), m = $('#s-msg'); t.value = c; t.select();
    const done = ok => { m.textContent = ok ? 'Code copied. Paste it somewhere safe.' : 'Select the code above and copy it.'; };

  },
  import() { try { const j = JSON.parse(decodeURIComponent(escape(atob($('#s-code').value.trim())))); if (!j || j.v !== 1 || !j.w) throw 0; S = Object.assign(defaults(), j); S.set = Object.assign(defaults().set, j.set || {}); save(); buildOrder(); pickVoice(); closeModal(); home(); } catch (e) { $('#s-msg').textContent = 'That code did not work. Check that you pasted all of it.'; } },
  wipe() { if (confirm('Delete all your progress? This cannot be undone.')) { S = defaults(); save(); buildOrder(); closeModal(); home(); } }
};
document.addEventListener('click', ev => {
  if (ev.target === modal) { ACT.close(); return; }
  const a = ev.target.closest('[data-act]'); if (!a || a.disabled) return;
  const f = ACT[a.dataset.act]; if (f) f(a, ev);
});
document.addEventListener('input', ev => {
  const id = ev.target.id;
  if (id === 'q') find(ev.target.value);
  else if (id === 's-rate') { S.set.rate = +ev.target.value; save(); }
});
document.addEventListener('change', ev => {
  const t = ev.target, id = t.id; if (!/^s-/.test(id)) return;
  if (id === 's-voice') { S.set.voice = t.value; pickVoice(); say('Hello! This is how I say the words.'); }
  else if (id === 's-auto') S.set.auto = t.checked;
  else if (id === 's-snd') S.set.snd = t.checked;
  else if (id === 's-mic') S.set.mic = t.checked;
  else if (id === 's-size') S.set.size = +t.value;
  else if (id === 's-goal') S.set.goal = +t.value;
  save();
});
addEventListener('keydown', ev => {
  if (modal.firstChild) { if (ev.key === 'Escape') ACT.close(); return; }
  const tag = ev.target.tagName;
  if ((view === 'q' || view === 'sprint') && /^[1-4]$/.test(ev.key) && tag !== 'INPUT') { const b = $$('.opt')[+ev.key - 1]; if (b && !b.disabled) b.click(); }
  if (ev.key === 'Enter' && foot.classList.contains('on')) { const g = $('.go', foot); if (g && document.activeElement !== g) g.click(); }
});
addEventListener('pagehide', () => { if (SES && !SES.fin && SES.n) { try { finalize(); SES.st = {}; } catch (e) { } } });
window.__WG = { W, get S() { return S; }, build, canCloze, ORDER: () => ORDER, ses: () => SES };
home();
})();
